<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boatera's Pages</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #09090b;
        --fg: #f4f4f5;
        --card-bg: #18181b;
        --card-border: #27272a;
        --card-hover-bg: #27272a;
        --card-hover-border: #3f3f46;
        --title-color: #ffffff;
        --group-title: #a1a1aa;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #fafafa;
          --fg: #09090b;
          --card-bg: #ffffff;
          --card-border: #e4e4e7;
          --card-hover-bg: #f4f4f5;
          --card-hover-border: #d4d4d8;
          --title-color: #09090b;
          --group-title: #71717a;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--fg);
        min-height: 100vh;
        padding: 4rem 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        -webkit-font-smoothing: antialiased;
      }

      .container {
        width: 100%;
        max-width: 640px;
      }

      h1 {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        color: var(--title-color);
        margin-bottom: 2.5rem;
        text-align: center;
      }

      .group {
        margin-bottom: 2rem;
      }

      .group h2 {
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--group-title);
        margin-bottom: 1rem;
      }

      .tiles {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 1rem;
      }

      .tile {
        background: var(--card-bg);
        color: var(--fg);
        border: 1px solid var(--card-border);
        border-radius: 14px;
        padding: 1.25rem 1rem;
        text-align: center;
        text-decoration: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .tile:hover {
        background: var(--card-hover-bg);
        border-color: var(--card-hover-border);
        transform: translateY(-2px);
      }

      .tile img {
        width: 110px;
        height: 110px;
        object-fit: contain;
        margin-bottom: 0.875rem;
        border-radius: 10px;
        transition: transform 0.2s ease;
      }

      .tile:hover img {
        transform: scale(1.04);
      }

      .tile-label {
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--fg);
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>My Apps</h1>

      <div class="group">
        <h2>Board Game Tools</h2>
        <div class="tiles">
          <a href="/world-order" class="tile">
            <img src="./globe.png" alt="World Order" />
            <div class="tile-label">World Order</div>
          </a>
          <a href="/hegemony-taxes" class="tile">
            <img src="./hegemony-512x512.png" alt="Hegemony" />
            <div class="tile-label">Hegemony</div>
          </a>
          <a href="/jinxo-board" class="tile">
            <img src="./jinxo-512x512.png" alt="Jinxo" />
            <div class="tile-label">Jinxo</div>
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
